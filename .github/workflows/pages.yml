name: Pubblica su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: sito
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sito/package-lock.json
      - name: Installa dipendenze
        run: npm ci
      - name: Compila il sito
        run: npm run build
        env:
          SITE_BASE: /beauty-obsession/
      - name: Configura Pages
        uses: actions/configure-pages@v6
      - name: Carica il sito
        uses: actions/upload-pages-artifact@v5
        with:
          path: sito/dist
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v5
